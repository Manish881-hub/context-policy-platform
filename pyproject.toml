[project]
name = "isp-policy-platform"
version = "0.1.0"
description = "Context-aware policy platform — auth per tool call from identity+context, not prompt"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.8",
]
gcp = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.0",
]
rag = ["chromadb>=0.5", "sentence-transformers>=3.0", "pypdf>=4.0"]
sql = ["sqlglot>=24.0"]
db = ["psycopg[binary]>=3.1"]
prod = ["pypdf>=4.0", "sqlglot>=24.0", "psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
